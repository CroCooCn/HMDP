server:
  port: 8081
spring:
  application:
    name: hmdp
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://localhost:3306/hmdp?useSSL=false&serverTimezone=UTC&characterEncoding=utf8&useUnicode=true&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  redis:
    host: localhost
    port: 6379
    password: 
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段

# 阿里云短信配置 
# 阿里云账号 18140913796
aliyun:
  sms:
    access-key-id: your_access_key_id        # 替换为你的AccessKey ID
    access-key-secret: your_access_key_secret # 替换为你的AccessKey Secret
    sign-name: 你的签名名称                    # 短信签名，需要在阿里云申请
    template-code: SMS_XXXXXXXX              # 短信模板编码

mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
logging:
  level:
    com.hmdp: debug

app: 
  cache:
    #使用redis/session实现登录状态缓存
    login: redis 
    #使用互斥锁mutex还是逻辑过期logical-expire防止缓存击穿（查询数据的场景）
    breakdown: logical-expire
    #使用乐观锁optim还是悲观锁pessim防止超卖
    lock: optim
